server {
    listen 80;
    root /usr/share/nginx/html;

    # Hashed build assets never change; index.html must always be fresh
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
